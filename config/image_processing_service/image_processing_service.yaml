# Image Processing Service runtime policies and safety limits.
# TODO: camera_ids is currently required by ImageProcessingServiceConfig.
# TODO: Dynamic camera registration is not yet supported in the IPS config model.

camera_ids:
  - "REPLACE_WITH_DEPLOYMENT_CAMERA_ID"

# Queue capacity limits.
max_queue_size_per_camera: 300
max_queue_bytes_per_camera: 524288000
reserved_queue_bytes_per_camera: 52428800
max_total_queued_bytes: 2147483648

# Freshness limit.
max_frame_age_ms: 30000

# Overflow behavior: DROP_OLDEST | DROP_NEWEST | REJECT
overflow_policy: "DROP_OLDEST"

# Shutdown behavior.
drain_on_shutdown: true
max_drain_timeout_ms: 30000
worker_shutdown_timeout_ms: 5000

# Degraded-state thresholds.
queue_degraded_utilization_threshold: 0.85
memory_degraded_utilization_threshold: 0.85
frame_drop_degraded_threshold_per_minute: 60
worker_lag_degraded_threshold_ms: 2000
stale_frame_drop_enabled: true
stale_frame_degraded_threshold_per_minute: 30

# Per-frame ROI/fan-out caps.
max_motion_regions_per_frame: 8
max_person_rois_per_frame: 16
max_face_rois_per_frame: 32
